<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Triangle of three capabilities. Reads outside content and touches private data are switched on. Sends or acts outside is switched off.">
  <rect width="640" height="340" fill="#ffffff" rx="6"/>
  <line x1="320" y1="52" x2="120" y2="240" stroke="#d6dde4" stroke-width="2"/>
  <line x1="320" y1="52" x2="520" y2="240" stroke="#d6dde4" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="120" y1="240" x2="520" y2="240" stroke="#d6dde4" stroke-width="2" stroke-dasharray="6 6"/>
  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
    <circle cx="320" cy="52" r="30" fill="#e3f1ea" stroke="#2f7d5b" stroke-width="2.5"/>
    <text x="320" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#2f7d5b">ON</text>
    <text x="320" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#16212b">Reads outside content</text>
    <text x="320" y="130" text-anchor="middle" font-size="13" fill="#5c6b78">email, web pages, shared files</text>
    <circle cx="120" cy="240" r="30" fill="#e3f1ea" stroke="#2f7d5b" stroke-width="2.5"/>
    <text x="120" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#2f7d5b">ON</text>
    <text x="120" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#16212b">Touches private data</text>
    <circle cx="520" cy="240" r="30" fill="#fbeedd" stroke="#d4791f" stroke-width="2.5"/>
    <path d="M511 231 L529 249 M529 231 L511 249" stroke="#d4791f" stroke-width="3" stroke-linecap="round"/>
    <text x="520" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#16212b">Sends or acts outside</text>
    <text x="320" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#5c6b78">Two are in use, so the third is switched off before the agent's next step</text>
  </g>
</svg>
